name: sync published playgrounds

on:
  workflow_run:
    workflows:
      - check and deploy docs and playground
      - publish-version
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-published-playgrounds
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site
      - name: Update every published playground
        working-directory: site
        run: |
          bash ../source/scripts/sync_playgrounds.sh .
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m 'Update published playgrounds from unstable'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
